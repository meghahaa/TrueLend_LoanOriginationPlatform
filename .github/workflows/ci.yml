name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # Jobs skip themselves until the files they need exist (keeps the substrate-only PR green).
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -f requirements.txt ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package-lock.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Layering contracts (import-linter, .importlinter)
        run: lint-imports
      - name: Tests + coverage (threshold 80%)
        run: pytest --cov=src --cov-report=xml --cov-fail-under=80
      - name: AC traceability
        run: python scripts/ac_coverage.py
      - uses: actions/upload-artifact@v4
        with: { name: coverage-xml, path: coverage.xml }

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

  e2e:
    needs: [backend, frontend]        # skipped automatically if either is skipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r requirements.txt
      - run: cd frontend && npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test   # config starts `python -m src` via webServer
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "frontend/playwright-report\ntests/e2e/snapshots" }

  # Claude Code Action: only when the PR carries the `claude-review` label (keeps API spend predictable).
  claude-review:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}  PR: ${{ github.event.pull_request.number }}
            Review this PR against CLAUDE.md and the specs it touches. Check: spec conformance, AC-tagged tests,
            Decimal-only money, append-only policies/migrations/schedules, no PAN/Aadhaar in logs, layering, and that
            no hand-written production code bypassed the agent workflow. Post one concise review comment.
          claude_args: "--max-turns 6"
